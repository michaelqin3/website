# Free Supabase projects pause after 7 days without database activity.
# This makes one tiny query twice a week so the dates page stays awake.
# It uses the same public key the page already ships in dates/config.json.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Supabase
        run: |
          URL=$(jq -r .supabaseUrl dates/config.json)
          KEY=$(jq -r .supabaseKey dates/config.json)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not configured yet"; exit 0; fi
          curl -fsS "$URL/rest/v1/dates?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
