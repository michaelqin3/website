<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michael and Rita's Dates</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#fbf8f3;--card:#fff;--ink:#2b2622;--muted:#8a8078;--accent:#d9534f;--line:#ece6dd;--r:14px}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:1000;background:rgba(251,248,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}
  .top{display:flex;align-items:center;justify-content:space-between;height:58px}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  h1 small{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
  nav{display:flex;gap:4px;padding-bottom:10px}
  nav button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--muted)}
  nav button.active{background:var(--ink);color:#fff}
  .btn{border:0;background:var(--accent);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;font-weight:600}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:5px 10px;font-size:12px}
  main{padding:16px 0 60px}
  .view{display:none}.view.active{display:block}
  #map{height:calc(100vh - 140px);min-height:420px;border-radius:var(--r);border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .12s}
  .card:hover{transform:translateY(-2px)}
  .card .ph{aspect-ratio:4/3;background:#f1ece4 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px}
  .card .b{padding:12px 14px}
  .card h3{margin:0 0 2px;font-size:16px}
  .meta{color:var(--muted);font-size:13px}
  .stars{color:#e8a33d;letter-spacing:1px}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  .wish{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
  .wish .t{flex:1}.wish h3{margin:0;font-size:16px}
  .wish p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .wish .acts{display:flex;gap:6px;flex-shrink:0}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:2000;padding:30px 12px;overflow:auto}
  .modal.open{display:flex}
  .sheet{background:#fff;border-radius:18px;width:100%;max-width:560px;padding:22px}
  .sheet h2{margin:0 0 14px;font-size:20px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  input[type=text],input[type=date],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fcfbf9}
  textarea{min-height:110px;resize:vertical}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .results{border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:180px;overflow:auto;display:none;background:#fff}
  .results div{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
  .results div:hover{background:#f6f2eb}
  .picked{font-size:13px;color:#2e7d4f;margin-top:4px}
  .minimap{height:200px;border-radius:10px;border:1px solid var(--line);margin-top:8px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;padding-top:6px}
  .thumb{position:relative}
  .thumb img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block}
  .thumb .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:var(--ink);color:#fff;font-size:13px;line-height:1;padding:0;cursor:pointer}
  #lightbox{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
  #lightbox.open{display:flex}
  #lightbox img{max-width:100%;max-height:100%;border-radius:8px}
  #lightbox .close{position:absolute;top:12px;right:14px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer}
  .rate{display:flex;gap:4px;font-size:26px;cursor:pointer;user-select:none}
  .rate span{color:#ddd}.rate span.on{color:#e8a33d}
  body.no-rita .rita-only, body.no-stops .stops-only{display:none}
  .rate.sm{font-size:20px}
  .stop{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:#fcfbf9}
  .stop.active{border-color:var(--ink)}
  .stop-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .stop-head .rm{margin-left:auto;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
  .stop input[type=text]{margin-top:6px;background:#fff}
  .stop .row label{margin-top:8px}
  .num,.numpin{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font:600 12px/1 sans-serif;flex-shrink:0}
  .numpin{width:24px;height:24px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .numpin.active{background:var(--ink)}
  .stoplist{margin:12px 0;padding:0;list-style:none}
  .stoplist li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .stoplist li:last-child{border-bottom:0}
  .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  /* detail */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:12px 0}
  .gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in}
  .review{white-space:pre-wrap;margin:10px 0}
  .popup h4{margin:0 0 2px}.popup{font-size:13px}
  .popup img{width:100%;border-radius:8px;margin-top:6px}
  .photopin{width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:#eee center/cover no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.35);position:relative}
  .photopin::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  #login form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;width:100%;max-width:360px}
  #login h1{margin-bottom:6px}
  #login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fcfbf9}
  #login .btn{width:100%;margin-top:16px;padding:10px}
  .err{color:var(--accent);font-size:13px;margin-top:10px;min-height:1em}
  body:not(.authed) #app, body.authed #login{display:none}
  .busy{opacity:.6;pointer-events:none}
  @media(max-width:600px){
    .top .btn{padding:6px 10px;font-size:13px}
    #map{height:calc(100vh - 150px)}
  }
</style>
</head>
<body>
<section id="login">
  <form onsubmit="signIn(event)">
    <h1>💌 Michael and Rita's Dates</h1>
    <p class="meta">Private. Sign in to continue.</p>
    <label>Email</label><input type="email" name="email" autocomplete="username" required>
    <label>Password</label><input type="password" name="password" autocomplete="current-password" required>
    <button class="btn">Sign in</button>
    <div class="err" id="login-err"></div>
  </form>
</section>

<div id="app">
<header>
  <div class="wrap">
    <div class="top">
      <h1>💌 Michael and Rita's Dates <small id="count"></small></h1>
      <div style="display:flex;gap:6px">
        <button class="btn ghost" onclick="openWishForm()">+ Wish</button>
        <button class="btn" onclick="openDateForm()">+ Date</button>
      </div>
    </div>
    <nav>
      <button data-v="map" class="active">🗺️ Map</button>
      <button data-v="list">📋 List</button>
      <button data-v="wish">✨ Wishlist</button>
      <button style="margin-left:auto" onclick="signOut()">Sign out</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="v-map" class="view active"><div id="map"></div></section>
  <section id="v-list" class="view"><div id="list" class="grid"></div></section>
  <section id="v-wish" class="view"><div id="wishlist"></div></section>
</main>
</div>

<!-- Add / edit date -->
<div class="modal" id="m-date" onclick="if(event.target===this)closeModals()">
  <form class="sheet" id="f-date" onsubmit="saveDate(event)">
    <h2 id="f-date-title">New date</h2>
    <input type="hidden" name="id">
    <label>Title</label>
    <input type="text" name="title" required placeholder="Ramen + arcade night">
    <label>Date</label>
    <input type="date" name="date">
    <label>Places</label>
    <div id="d-stops"></div>
    <button type="button" class="btn ghost sm stops-only" style="margin-top:8px" onclick="addStop()">+ Add another place</button>
    <div class="minimap" id="d-map"></div>
    <div class="hint" id="d-hint">Tap the map to set the pin for the highlighted place, or drag a pin to adjust.</div>
    <div class="row">
      <div><label>Michael's overall</label><div class="rate" id="d-rate-m"></div></div>
      <div class="rita-only"><label>Rita's overall</label><div class="rate" id="d-rate-r"></div></div>
    </div>
    <label>Review</label>
    <textarea name="review" placeholder="How was it? What did you eat, what would you do again…"></textarea>
    <label>Photos</label>
    <input type="file" id="d-photos" accept="image/*" multiple>
    <div class="thumbs" id="d-thumbs"></div>
    <div class="foot">
      <button type="button" class="btn ghost" onclick="closeModals()">Cancel</button>
      <button class="btn" id="d-save">Save</button>
    </div>
  </form>
</div>

<!-- Add wish -->
<div class="modal" id="m-wish" onclick="if(event.target===this)closeModals()">
  <form class="sheet" id="f-wish" onsubmit="saveWish(event)">
    <h2>Add to wishlist</h2>
    <label>Place / idea</label>
    <input type="text" name="title" required placeholder="That rooftop bar in Williamsburg">
    <label>Location (optional)</label>
    <input type="text" id="w-loc" placeholder="Search a place or address…" autocomplete="off">
    <div class="results" id="w-results"></div>
    <div class="picked" id="w-picked"></div>
    <div class="minimap" id="w-map"></div>
    <div class="hint">Can't find it? Tap the map to drop the pin, or drag the pin to adjust.</div>
    <label>Note</label>
    <textarea name="note" placeholder="Why we want to go, link, who recommended it…" style="min-height:70px"></textarea>
    <div class="foot">
      <button type="button" class="btn ghost" onclick="closeModals()">Cancel</button>
      <button class="btn">Save</button>
    </div>
  </form>
</div>

<!-- Full-size photo -->
<div id="lightbox" onclick="closeLightbox()"><button class="close" aria-label="Close">×</button><img alt=""></div>

<!-- Detail -->
<div class="modal" id="m-detail" onclick="if(event.target===this)closeModals()">
  <div class="sheet" id="detail"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let sb;                                  // Supabase client
let db = {dates: [], wishlist: []};
let urls = {};                           // photo path -> signed URL
let cfg = {center: [40.73, -73.97], bbox: [-74.26, 40.49, -73.70, 40.92]};  // NYC defaults
let map, layer;
let picked = {w: null};                  // wishlist form: {name, address, lat, lng}
let stops = [], activeStop = 0;          // date form: [{name, address, lat, lng, rating, rating_rita}]
let hasStops = false;                    // true once the stops column exists in Supabase
let hasAddress = false;                  // true once the address column exists in Supabase
let photos = [], origPhotos = [], newUploads = [];  // photo paths for the date being edited
let ratings = {m: 0, r: 0}, pendingWishId = null, saved = false;   // m = Michael (column "rating"), r = Rita
let hasRita = false;                     // true once the rating_rita column exists in Supabase
const BUCKET = 'photos';

// ---------- startup & auth ----------
async function start() {
  try { Object.assign(cfg, await (await fetch('config.json?t=' + Date.now())).json()); } catch {}
  if (!cfg.supabaseUrl || !cfg.supabaseKey) { $('#login-err').textContent = 'Not configured yet: add supabaseUrl and supabaseKey to config.json.'; return; }
  sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  sb.auth.onAuthStateChange((_e, session) => setTimeout(() => session ? enter() : leave(), 0));
}
async function signIn(e) {
  e.preventDefault();
  const f = e.target; f.classList.add('busy'); $('#login-err').textContent = '';
  const {error} = await sb.auth.signInWithPassword({email: f.email.value.trim(), password: f.password.value});
  f.classList.remove('busy');
  if (error) $('#login-err').textContent = error.message;
}
async function signOut() { await sb.auth.signOut(); }
let entered = false;
async function enter() {
  if (entered) return; entered = true;
  const {data: ok} = await sb.rpc('is_allowed');
  if (!ok) {
    entered = false;
    const email = (await sb.auth.getUser()).data.user?.email;
    await sb.auth.signOut();
    $('#login-err').textContent = `${email || 'This account'} is not on the allowed list.`;
    return;
  }
  hasAddress = !(await sb.from('dates').select('address').limit(1)).error;
  hasRita = !(await sb.from('dates').select('rating_rita').limit(1)).error;
  hasStops = !(await sb.from('dates').select('stops').limit(1)).error;
  document.body.classList.toggle('no-rita', !hasRita);
  document.body.classList.toggle('no-stops', !hasStops);
  document.body.classList.add('authed');
  if (!map) initMap();
  setTimeout(() => map.invalidateSize(), 50);
  await load();
}
function leave() {
  entered = false; db = {dates: [], wishlist: []}; urls = {};
  document.body.classList.remove('authed'); closeModals();
}

// ---------- data ----------
function check({data, error}) { if (error) { alert(error.message); throw error; } return data; }
async function load() {
  const [d, w] = await Promise.all([
    sb.from('dates').select('*').order('date', {ascending: false, nullsFirst: false}).order('created_at', {ascending: false}),
    sb.from('wishlist').select('*').order('created_at', {ascending: false}),
  ]);
  db = {dates: check(d), wishlist: check(w)};
  await signPhotos(db.dates.flatMap(x => x.photos || []));
  render();
}
async function signPhotos(paths) {
  paths = paths.filter(p => !urls[p]);
  if (!paths.length) return;
  const {data} = await sb.storage.from(BUCKET).createSignedUrls(paths, 60 * 60 * 12);
  (data || []).forEach(r => { if (r.signedUrl) urls[r.path] = r.signedUrl; });
}
const purl = p => urls[p] || '';
async function removePhotos(paths) { if (paths.length) await sb.storage.from(BUCKET).remove(paths); }
async function del(kind, id) {
  if (!confirm('Delete this?')) return;
  const item = db[kind].find(x => x.id === id);
  check(await sb.from(kind).delete().eq('id', id));
  if (kind === 'dates') await removePhotos(item?.photos || []);
  closeModals(); load();
}

// ---------- tabs ----------
document.querySelectorAll('nav button[data-v]').forEach(b => b.onclick = () => showView(b.dataset.v));
function showView(v) {
  document.querySelectorAll('nav button[data-v]').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'v-' + v));
  if (v === 'map') setTimeout(() => map.invalidateSize(), 50);
}

// ---------- map ----------
function initMap() {
  map = L.map('map').setView(cfg.center, 12);
  layer = L.layerGroup().addTo(map);
  L.tileLayer(cfg.tileUrl || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: cfg.attribution || '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
}
const pin = (emoji) => L.divIcon({html: `<div style="font-size:26px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">${emoji}</div>`, className: '', iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24]});
const photoPin = (src) => L.divIcon({html: `<div class="photopin" style="background-image:url('${src}')"></div>`, className: '', iconSize: [44, 44], iconAnchor: [22, 50], popupAnchor: [0, -48]});

function renderMap() {
  layer.clearLayers();
  const pts = [];
  db.dates.forEach(d => {
    const ss = getStops(d).filter(s => s.lat != null);
    const first = purl(d.photos?.[0]);
    if (ss.length > 1) L.polyline(ss.map(s => [s.lat, s.lng]), {color: '#d9534f', weight: 2, dashArray: '4 6', opacity: .7}).addTo(layer);
    ss.forEach((s, i) => {
      const m = L.marker([s.lat, s.lng], {icon: first ? photoPin(first) : pin('❤️')}).addTo(layer);
      m.bindPopup(`<div class="popup"><h4>${esc(s.name || d.title)}</h4>${s.address ? `<div class="meta">📍 ${esc(s.address)}</div>` : ''}${ratingsHtml(s) ? `<div class="meta">${ratingsHtml(s)}</div>` : ''}<div class="meta">${esc(d.title)}${d.date ? ' · ' + d.date : ''}${ss.length > 1 ? ` · stop ${i + 1} of ${ss.length}` : ''}</div>${first ? `<img src="${first}">` : ''}<br><a href="#" onclick="openDetail('${d.id}');return false">Open</a></div>`);
      pts.push([s.lat, s.lng]);
    });
  });
  db.wishlist.filter(w => w.lat != null).forEach(w => {
    const m = L.marker([w.lat, w.lng], {icon: pin('✨'), opacity: .85}).addTo(layer);
    m.bindPopup(`<div class="popup"><h4>${esc(w.title)}</h4><span class="meta">Wishlist${placeLine(w) ? ' · ' + esc(placeLine(w)) : ''}</span>${w.note ? `<p>${esc(w.note)}</p>` : ''}</div>`);
    pts.push([w.lat, w.lng]);
  });
  if (pts.length) map.fitBounds(pts, {padding: [40, 40], maxZoom: 14});
}

// ---------- list ----------
function renderList() {
  const el = $('#list');
  if (!db.dates.length) { el.innerHTML = '<div class="empty">No dates yet. Add your first one!</div>'; return; }
  el.innerHTML = db.dates.map(d => {
    const first = purl(d.photos?.[0]);
    return `
    <div class="card" onclick="openDetail('${d.id}')">
      <div class="ph" style="${first ? `background-image:url('${first}')` : ''}">${first ? '' : '💌'}</div>
      <div class="b">
        <h3>${esc(d.title)}</h3>
        <div class="meta">${esc(getStops(d).map(s => s.name || s.address).filter(Boolean).join(' → '))}</div>
        <div class="meta">${[ratingsHtml(d), d.date].filter(Boolean).join(' · ')}</div>
      </div>
    </div>`;
  }).join('');
}

// ---------- wishlist ----------
function renderWish() {
  const el = $('#wishlist');
  if (!db.wishlist.length) { el.innerHTML = '<div class="empty">Wishlist is empty. Add somewhere you want to go!</div>'; return; }
  el.innerHTML = db.wishlist.map(w => `
    <div class="wish">
      <div style="font-size:22px">✨</div>
      <div class="t"><h3>${esc(w.title)}</h3>
        ${placeLine(w) ? `<p>📍 ${esc(placeLine(w))}</p>` : ''}
        ${w.note ? `<p>${esc(w.note)}</p>` : ''}</div>
      <div class="acts">
        <button class="btn sm" onclick="convertWish('${w.id}')">We went!</button>
        <button class="btn sm ghost" onclick="del('wishlist','${w.id}')">✕</button>
      </div>
    </div>`).join('');
}

function render() {
  $('#count').textContent = `${db.dates.length} date${db.dates.length === 1 ? '' : 's'}`;
  renderMap(); renderList(); renderWish();
}

// ---------- place search + pin picker (Photon / OpenStreetMap, limited to cfg.bbox) ----------
// "Fifth Avenue" -> "5th Avenue": OSM stores NYC streets as numerals.
const ORD = {first: '1st', second: '2nd', third: '3rd', fourth: '4th', fifth: '5th', sixth: '6th', seventh: '7th', eighth: '8th', ninth: '9th', tenth: '10th', eleventh: '11th', twelfth: '12th'};
const normQuery = q => q.replace(/\b(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth)(?=\s+(ave|avenue|av|st|street|pl|place)\b)/gi, m => ORD[m.toLowerCase()]);
function fmt(p, coords) {
  const street = [p.housenumber, p.street].filter(Boolean).join(' ');
  const area = p.district || p.city;
  const address = [street, area].filter(Boolean).join(', ');
  return {poi: p.name || '', title: p.name || street || area || 'Dropped pin', address,
          kind: (p.osm_value || '').replace(/_/g, ' '), lat: coords[1], lng: coords[0]};
}
async function photon(q) {
  const [lat, lon] = cfg.center;
  const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=7&lang=en&lat=${lat}&lon=${lon}&bbox=${cfg.bbox.join(',')}`);
  return (await r.json()).features.map(f => fmt(f.properties, f.geometry.coordinates));
}
async function searchPlaces(q) {
  const n = normQuery(q);
  const lists = await Promise.all(n === q ? [photon(q)] : [photon(n), photon(q)]);
  const seen = new Set();
  return lists.flat().filter(it => { const k = `${it.title}|${it.lat.toFixed(5)}|${it.lng.toFixed(5)}`; return !seen.has(k) && seen.add(k); }).slice(0, 8);
}

// Shared search box behaviour: debounce, list results, call onPick(result).
function attachSearch(inp, res, onPick) {
  let t;
  inp.addEventListener('input', () => {
    clearTimeout(t);
    const q = inp.value.trim();
    if (q.length < 3) { res.style.display = 'none'; return; }
    t = setTimeout(async () => {
      const items = await searchPlaces(q);
      res.innerHTML = items.map((it, i) => `<div data-i="${i}"><b>${esc(it.title)}</b> <span class="meta">${esc(it.kind)}</span><br><span class="meta">${esc(it.poi ? it.address : '')}</span></div>`).join('')
        || '<div class="meta">No results. Try the street address, or tap the map below to drop the pin.</div>';
      res.style.display = 'block';
      res.querySelectorAll('div[data-i]').forEach(d => d.onclick = () => { res.style.display = 'none'; onPick(items[d.dataset.i]); });
    }, 350);
  });
}
async function reverseAddress(ll) {
  try {
    const r = await fetch(`https://photon.komoot.io/reverse?lat=${ll.lat}&lon=${ll.lng}&lang=en&limit=1`);
    const f = (await r.json()).features[0];
    return f ? fmt(f.properties, f.geometry.coordinates).address : '';
  } catch { return ''; }
}
const tiles = m => L.tileLayer(cfg.tileUrl || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; OpenStreetMap'}).addTo(m);

// ----- wishlist form: one location -----
let wmap, wmarker;
function showWishMap() {
  setTimeout(() => {
    if (!wmap) { wmap = L.map('w-map').setView(cfg.center, 12); tiles(wmap); wmap.on('click', e => wishPin(e.latlng)); }
    wmap.invalidateSize();
    if (wmarker) { wmarker.remove(); wmarker = null; }
    wmap.setView(cfg.center, 12);
  }, 60);
}
function wishMarker(ll) {
  if (!wmarker) { wmarker = L.marker(ll, {draggable: true}).addTo(wmap); wmarker.on('dragend', () => wishPin(wmarker.getLatLng())); }
  else wmarker.setLatLng(ll);
}
async function wishPin(ll) {
  picked.w = {name: picked.w?.name || '', address: '', lat: ll.lat, lng: ll.lng};
  const p = picked.w; wishMarker(ll);
  $('#w-picked').textContent = '📍 Pin dropped, finding address…';
  const addr = await reverseAddress(ll);
  if (picked.w !== p) return;
  p.address = addr; $('#w-loc').value = addr;
  $('#w-picked').textContent = '📍 ' + (addr || 'Pin set');
}
attachSearch($('#w-loc'), $('#w-results'), it => {
  picked.w = {name: it.poi, address: it.address, lat: it.lat, lng: it.lng};
  $('#w-loc').value = it.address || it.title;
  $('#w-picked').textContent = '📍 ' + [it.poi, it.address].filter(Boolean).join(' · ');
  wishMarker([it.lat, it.lng]); wmap.setView([it.lat, it.lng], 16);
});
const placeLine = x => [x.place, x.address].filter(Boolean).join(' · ');

// ----- date form: several places ("stops") per date, each with its own ratings -----
// Older rows kept one location in place/address/lat/lng; treat that as a single stop.
function getStops(d) {
  if (Array.isArray(d.stops) && d.stops.length) return d.stops;
  return d.lat != null || d.place || d.address ? [{name: d.place, address: d.address, lat: d.lat, lng: d.lng}] : [];
}
let dmap, dlayer;
const numIcon = (n, active) => L.divIcon({html: `<div class="numpin${active ? ' active' : ''}">${n}</div>`, className: '', iconSize: [24, 24], iconAnchor: [12, 12]});
const stopEl = i => $('#d-stops').children[i];
function showDateMap() {
  setTimeout(() => {
    if (!dmap) {
      dmap = L.map('d-map').setView(cfg.center, 12); tiles(dmap);
      dlayer = L.layerGroup().addTo(dmap);
      dmap.on('click', e => pinStop(activeStop, e.latlng));
    }
    dmap.invalidateSize();
    drawStopMarkers(true);
  }, 60);
}
function drawStopMarkers(fit) {
  if (!dlayer) return;
  dlayer.clearLayers();
  const pts = [];
  stops.forEach((s, i) => {
    if (s.lat == null) return;
    const m = L.marker([s.lat, s.lng], {draggable: true, icon: numIcon(i + 1, i === activeStop)}).addTo(dlayer);
    m.on('dragend', () => pinStop(i, m.getLatLng()));
    m.on('click', () => setActiveStop(i));
    pts.push([s.lat, s.lng]);
  });
  if (pts.length > 1) L.polyline(pts, {color: '#d9534f', weight: 2, dashArray: '4 6'}).addTo(dlayer);
  if (!fit) return;
  if (pts.length > 1) dmap.fitBounds(pts, {padding: [30, 30], maxZoom: 16});
  else if (pts.length) dmap.setView(pts[0], 16);
  else dmap.setView(cfg.center, 12);
}
function setActiveStop(i) {
  if (!stops.length) return;
  activeStop = Math.max(0, Math.min(i, stops.length - 1));
  [...$('#d-stops').children].forEach((el, j) => el.classList.toggle('active', j === activeStop));
  const s = stops[activeStop];
  $('#d-hint').textContent = `Tap the map to set the pin for place ${activeStop + 1}${s.name ? ` (${s.name})` : ''}, or drag a pin to adjust.`;
  drawStopMarkers(false);
}
async function pinStop(i, ll) {
  const s = stops[i]; if (!s) return;
  Object.assign(s, {lat: ll.lat, lng: ll.lng, address: ''});
  setActiveStop(i);
  stopEl(i).querySelector('.picked').textContent = '📍 Pin dropped, finding address…';
  const addr = await reverseAddress(ll);
  const j = stops.indexOf(s);
  if (j < 0 || s.lat !== ll.lat) return;      // stop removed or moved again meanwhile
  s.address = addr;
  stopEl(j).querySelector('.loc').value = addr;
  stopEl(j).querySelector('.picked').textContent = '📍 ' + (addr || 'Pin set');
}
function renderStops() {
  $('#d-stops').innerHTML = stops.map((s, i) => `
    <div class="stop${i === activeStop ? ' active' : ''}">
      <div class="stop-head"><span class="num">${i + 1}</span><span>Place ${i + 1}</span>${stops.length > 1 ? `<button type="button" class="rm" aria-label="Remove place" onclick="event.stopPropagation();removeStop(${i})">×</button>` : ''}</div>
      <input type="text" class="name" placeholder="Place name, e.g. Bondi Sushi" value="${esc(s.name || '')}">
      <input type="text" class="loc" placeholder="Search a place or address, e.g. 246 5th Ave" autocomplete="off" value="${esc(s.address || '')}">
      <div class="results"></div>
      <div class="picked">${s.lat != null ? '📍 ' + esc(s.address || 'Pin set') : ''}</div>
      <div class="row stops-only">
        <div><label>Michael</label><div class="rate sm" data-who="rating"></div></div>
        <div><label>Rita</label><div class="rate sm" data-who="rating_rita"></div></div>
      </div>
    </div>`).join('');
  [...$('#d-stops').children].forEach((el, i) => {
    const s = stops[i], name = el.querySelector('.name'), loc = el.querySelector('.loc');
    el.addEventListener('click', () => setActiveStop(i));
    el.addEventListener('focusin', () => setActiveStop(i));
    name.addEventListener('input', () => { s.name = name.value; });
    loc.addEventListener('input', () => { s.address = loc.value; });   // typed address is kept even without a pick
    attachSearch(loc, el.querySelector('.results'), it => {
      Object.assign(s, {address: it.address, lat: it.lat, lng: it.lng});
      if (it.poi && !s.name?.trim()) { s.name = it.poi; name.value = it.poi; }
      loc.value = it.address || it.title;
      el.querySelector('.picked').textContent = '📍 ' + [it.poi, it.address].filter(Boolean).join(' · ');
      setActiveStop(i);
      dmap?.setView([it.lat, it.lng], 16);
    });
    drawStopRating(i, 'rating'); drawStopRating(i, 'rating_rita');
  });
}
// Tap a star to rate; tap the same star again to clear.
function setStopRating(i, who, n) { stops[i][who] = stops[i][who] === n ? 0 : n; drawStopRating(i, who); }
function drawStopRating(i, who) {
  const n = stops[i][who] || 0;
  stopEl(i).querySelector(`.rate[data-who="${who}"]`).innerHTML =
    [1, 2, 3, 4, 5].map(k => `<span class="${k <= n ? 'on' : ''}" onclick="setStopRating(${i},'${who}',${k})">★</span>`).join('');
}
function addStop() {
  stops.push({}); renderStops(); setActiveStop(stops.length - 1);
  stopEl(stops.length - 1).querySelector('.name').focus();
}
function removeStop(i) {
  stops.splice(i, 1);
  if (activeStop >= i && activeStop > 0) activeStop--;
  renderStops(); setActiveStop(activeStop);
}

// ---------- date form ----------
// Tap a star to rate; tap the same star again to clear.
function setRating(who, n) { ratings[who] = ratings[who] === n ? 0 : n; drawRating(who); }
function drawRating(who) {
  const n = ratings[who];
  $(`#d-rate-${who}`).innerHTML = [1, 2, 3, 4, 5].map(i => `<span class="${i <= n ? 'on' : ''}" onclick="setRating('${who}',${i})">★</span>`).join('');
}
function openDateForm(d = null, prefill = null) {
  const f = $('#f-date'); f.reset();
  d = d || prefill || {};
  $('#f-date-title').textContent = d.id ? 'Edit date' : 'New date';
  f.id.value = d.id || '';
  f.title.value = d.title || '';
  f.date.value = d.date || new Date().toISOString().slice(0, 10);
  f.review.value = d.review || '';
  stops = getStops(d).map(s => ({...s}));
  if (!stops.length) stops = [{}];
  activeStop = 0; renderStops(); setActiveStop(0);
  photos = [...(d.photos || [])]; origPhotos = [...photos]; newUploads = []; saved = false;
  ratings = {m: d.rating || 0, r: d.rating_rita || 0}; drawRating('m'); drawRating('r');
  renderThumbs();
  $('#m-date').classList.add('open');
  showDateMap();
}
function renderThumbs() {
  $('#d-thumbs').innerHTML = photos.map((p, i) => `<div class="thumb">
      <img src="${purl(p)}" alt="" onclick="openLightbox(this.src)">
      <button type="button" class="x" aria-label="Remove photo" onclick="photos.splice(${i},1);renderThumbs()">×</button>
    </div>`).join('');
}
// Shrink photos before upload: max 1600px JPEG keeps storage small (~300KB each).
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = Object.assign(document.createElement('canvas'), {width: Math.round(bmp.width * s), height: Math.round(bmp.height * s)});
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return blob ? {blob, ext: 'jpg', type: 'image/jpeg'} : null;
  } catch { return null; }
}
$('#d-photos').onchange = async e => {
  const btn = $('#d-save'); btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    for (const file of e.target.files) {
      const small = await shrink(file);
      const blob = small?.blob || file;
      const ext = small?.ext || (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${crypto.randomUUID()}.${ext}`;
      check(await sb.storage.from(BUCKET).upload(path, blob, {contentType: small?.type || file.type}));
      newUploads.push(path); photos.push(path);
    }
    await signPhotos(newUploads);
    renderThumbs();
  } finally { btn.disabled = false; btn.textContent = 'Save'; e.target.value = ''; }
};
async function saveDate(e) {
  e.preventDefault();
  const f = e.target, btn = $('#d-save');
  const item = {
    title: f.title.value.trim(), date: f.date.value || null,
    review: f.review.value.trim(), rating: ratings.m, photos,
  };
  if (hasRita) item.rating_rita = ratings.r;
  const clean = stops
    .filter(s => s.name?.trim() || s.address?.trim() || s.lat != null)
    .map(s => ({name: s.name?.trim() || null, address: s.address?.trim() || null, lat: s.lat ?? null, lng: s.lng ?? null,
                rating: s.rating || 0, rating_rita: s.rating_rita || 0}));
  if (hasStops) {
    // All places live in "stops"; clear the old single-location columns so they can't reappear.
    Object.assign(item, {stops: clean, place: null, lat: null, lng: null});
    if (hasAddress) item.address = null;
  } else {
    if (clean.length > 1) { alert('Saving more than one place needs the stops column. Run the SQL first, then refresh.'); return; }
    const s = clean[0] || {};
    Object.assign(item, {place: s.name ?? null, lat: s.lat ?? null, lng: s.lng ?? null});
    if (hasAddress) item.address = s.address ?? null;
  }
  btn.disabled = true;
  try {
    if (f.id.value) check(await sb.from('dates').update(item).eq('id', f.id.value));
    else check(await sb.from('dates').insert(item));
    saved = true;
    // photos removed while editing, including ones uploaded in this form and then removed
    await removePhotos([...origPhotos, ...newUploads].filter(p => !photos.includes(p)));
    if (pendingWishId) check(await sb.from('wishlist').delete().eq('id', pendingWishId));
  } finally { btn.disabled = false; }
  closeModals(); load();
}

// ---------- wish form ----------
function openWishForm() {
  $('#f-wish').reset(); picked.w = null; $('#w-picked').textContent = ''; $('#w-results').style.display = 'none';
  $('#m-wish').classList.add('open');
  showWishMap();
}
async function saveWish(e) {
  e.preventDefault();
  const f = e.target;
  const item = {
    title: f.title.value.trim(), note: f.note.value.trim() || null,
    place: picked.w?.name || null,
    lat: picked.w?.lat ?? null, lng: picked.w?.lng ?? null,
  };
  if (hasAddress) item.address = picked.w?.address || $('#w-loc').value.trim() || null;
  check(await sb.from('wishlist').insert(item));
  closeModals(); load();
}
function convertWish(id) {
  const w = db.wishlist.find(x => x.id === id);
  openDateForm(null, {title: w.title, stops: [{name: w.place, address: w.address, lat: w.lat, lng: w.lng}]});
  pendingWishId = id;
}

// ---------- detail ----------
function openDetail(id) {
  const d = db.dates.find(x => x.id === id); if (!d) return;
  const ss = getStops(d), located = ss.some(s => s.lat != null);
  $('#detail').innerHTML = `
    <h2 style="margin-bottom:2px">${esc(d.title)}</h2>
    <div class="meta">${d.date || ''}${ratingsHtml(d) ? ` · Overall: ${ratingsHtml(d)}` : ''}</div>
    ${ss.length ? `<ol class="stoplist">${ss.map((s, i) => `<li><span class="num">${i + 1}</span><div>
        <b>${esc(s.name || s.address || 'Place')}</b>
        ${s.name && s.address ? `<div class="meta">${esc(s.address)}</div>` : ''}
        ${ratingsHtml(s) ? `<div class="meta">${ratingsHtml(s)}</div>` : ''}</div></li>`).join('')}</ol>` : ''}
    ${d.photos?.length ? `<div class="gal">${d.photos.map(p => `<img src="${purl(p)}" onclick="openLightbox(this.src)">`).join('')}</div>` : ''}
    ${d.review ? `<p class="review">${esc(d.review)}</p>` : '<p class="meta">No review yet.</p>'}
    <div class="foot">
      <button class="btn ghost" onclick="del('dates','${d.id}')">Delete</button>
      <button class="btn ghost" onclick="closeModals();openDateForm(db.dates.find(x=>x.id==='${d.id}'))">Edit</button>
      ${located ? `<button class="btn" onclick="showDayOnMap('${d.id}')">Show on map</button>` : ''}
    </div>`;
  $('#m-detail').classList.add('open');
}

function showDayOnMap(id) {
  const pts = getStops(db.dates.find(x => x.id === id)).filter(s => s.lat != null).map(s => [s.lat, s.lng]);
  closeModals(); showView('map');
  setTimeout(() => pts.length > 1 ? map.fitBounds(pts, {padding: [60, 60], maxZoom: 16}) : map.setView(pts[0], 16), 80);
}
function closeModals() {
  // Uploaded photos for a date form that was cancelled are deleted again.
  if ($('#m-date').classList.contains('open') && !saved && newUploads.length) removePhotos(newUploads);
  newUploads = []; saved = false;
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
  pendingWishId = null;
}
function openLightbox(src) { $('#lightbox img').src = src; $('#lightbox').classList.add('open'); }
function closeLightbox() { $('#lightbox').classList.remove('open'); }
// Escape closes the enlarged photo first, then any open form.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#lightbox').classList.contains('open')) closeLightbox(); else closeModals();
});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ratingsHtml = d => [['Michael', d.rating], ['Rita', d.rating_rita]].filter(([, n]) => n)
  .map(([who, n]) => `${who} <span class="stars">${stars(n)}</span>`).join(' · ');
const stars = n => n ? '★'.repeat(n) + '☆'.repeat(5 - n) : '';

start();
</script>
